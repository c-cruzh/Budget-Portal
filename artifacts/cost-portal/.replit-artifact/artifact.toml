kind = "web"
previewPath = "/"
title = "EmTech Digital El Salvador 2026 — Cost Portal"
version = "1.0.0"
id = "artifacts/cost-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/", "/api" ]
localPort = 18761

[services.development]
run = "pnpm --filter @workspace/cost-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cost-portal", "run", "build" ]

[services.production.run]
args = ["node", "artifacts/cost-portal/dist/server.mjs"]

[services.production.run.env]
PORT = "18761"
NODE_ENV = "production"

[services.env]
PORT = "18761"
BASE_PATH = "/"
